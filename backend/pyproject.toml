# Tool settings for the backend. Dependencies live in requirements*.txt (pinned).

[tool.pytest.ini_options]
# Run tests from backend/ with plain `pytest`: look in tests/ and make `import app` work.
testpaths = ["tests"]
pythonpath = ["."]
# SQLAlchemy warnings usually mean a real mistake (e.g. objects skipped on flush): fail.
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff.lint.isort]
# Our migrations folder is named alembic/, which makes Ruff think `alembic` is our own
# code. It is the installed library: sort it with the other third-party imports.
known-third-party = ["alembic"]
