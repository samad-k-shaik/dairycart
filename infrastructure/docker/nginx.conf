# nginx config for the frontend image (#57).
# Used as a template: ${PORT} is filled in when the container starts.
# (nginx's own variables such as $uri are left alone, because only defined
# environment variables are replaced.)

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text files before sending them (smaller downloads).
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Built JS/CSS files have a content hash in their name (index-DZvP86ME.js),
    # so they never change: browsers may keep them for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page app fallback: /admin/orders is not a real file. If no file
    # matches, send index.html and let React Router show the right page.
    # Without this, refreshing a deep link would give a 404.
    location / {
        try_files $uri $uri/ /index.html;
        # index.html must always be fresh so new deployments are picked up.
        add_header Cache-Control "no-cache";
    }
}
